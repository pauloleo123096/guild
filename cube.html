<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cube Admin - Content Editor</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-900 font-sans p-6">
    <div class="max-w-3xl mx-auto bg-white p-8 rounded-xl shadow-md border border-slate-200">
        <h1 class="text-3xl font-bold mb-2">Cube Dashboard</h1>
        <p class="text-slate-500 mb-8">Update the content on your live site via the GitHub REST API.</p>

        <!-- GitHub Config -->
        <div class="bg-slate-50 p-4 rounded-lg border border-slate-200 mb-8">
            <h2 class="text-lg font-semibold mb-4 text-slate-700">GitHub Credentials</h2>
            <div class="grid grid-cols-2 gap-4 mb-4">
                <div>
                    <label class="block text-sm font-medium mb-1">GitHub Username</label>
                    <input type="text" id="gh-owner" value="YOUR_GITHUB_USERNAME" class="w-full border rounded px-3 py-2 bg-white">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">Repository Name</label>
                    <input type="text" id="gh-repo" value="phguilds.org" class="w-full border rounded px-3 py-2 bg-white">
                </div>
            </div>
            <div>
                <label class="block text-sm font-medium mb-1">Personal Access Token (PAT)</label>
                <input type="password" id="gh-token" placeholder="ghp_xxxxxxxxxxxx" class="w-full border rounded px-3 py-2 bg-white mb-2">
                <p class="text-xs text-slate-500">Your token is never stored on a server. It remains locally in your browser session.</p>
            </div>
        </div>

        <!-- Content Editor -->
        <div class="mb-8">
            <h2 class="text-lg font-semibold mb-4 text-slate-700">Site Content</h2>
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium mb-1">Hero Title</label>
                    <input type="text" id="hero-title" class="w-full border rounded px-3 py-2 bg-white content-field" data-key="hero-title">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">Hero Subtitle</label>
                    <input type="text" id="hero-subtitle" class="w-full border rounded px-3 py-2 bg-white content-field" data-key="hero-subtitle">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">About Text</label>
                    <textarea id="about-text" rows="4" class="w-full border rounded px-3 py-2 bg-white content-field" data-key="about-text"></textarea>
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">Contact Email</label>
                    <input type="email" id="contact-email" class="w-full border rounded px-3 py-2 bg-white content-field" data-key="contact-email">
                </div>
            </div>
        </div>

        <!-- Actions -->
        <div class="flex gap-4">
            <button id="load-btn" class="bg-slate-200 hover:bg-slate-300 text-slate-800 px-6 py-2 rounded font-medium transition">Load Current Content</button>
            <button id="publish-btn" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded font-medium transition">Publish Changes to Live Site</button>
        </div>
        <div id="status-message" class="mt-4 text-sm font-medium hidden"></div>
    </div>

    <script>
        // UTF-8 safe base64 encoding prevents API errors when pushing emojis or special characters
        function utf8_to_b64(str) {
            return window.btoa(unescape(encodeURIComponent(str)));
        }
        function b64_to_utf8(str) {
            return decodeURIComponent(escape(window.atob(str)));
        }

        let currentFileSha = null;
        const filePath = 'content.json';

        function showStatus(msg, isError = false) {
            const el = document.getElementById('status-message');
            el.textContent = msg;
            el.className = `mt-4 text-sm font-medium p-3 rounded ${isError ? 'bg-red-100 text-red-700' : 'bg-green-100 text-green-700'}`;
            el.classList.remove('hidden');
        }

        async function fetchContent() {
            const owner = document.getElementById('gh-owner').value.trim();
            const repo = document.getElementById('gh-repo').value.trim();
            const token = document.getElementById('gh-token').value.trim();

            if (!owner || !repo || !token) {
                showStatus("Please enter your GitHub Username, Repo, and Token.", true);
                return;
            }

            try {
                const url = `https://api.github.com/repos/${owner}/${repo}/contents/${filePath}`;
                const res = await fetch(url, {
                    headers: {
                        'Authorization': `token ${token}`,
                        'Accept': 'application/vnd.github+json'
                    }
                });

                if (res.status === 404) {
                    showStatus("content.json not found in repo. Hitting publish will create it.");
                    return;
                }
                if (!res.ok) throw new Error(await res.text());

                const data = await res.json();
                currentFileSha = data.sha; // Save SHA to allow API overwriting
                
                const jsonContent = b64_to_utf8(data.content);
                const parsedContent = JSON.parse(jsonContent);

                document.querySelectorAll('.content-field').forEach(el => {
                    const key = el.getAttribute('data-key');
                    if (parsedContent[key] !== undefined) {
                        el.value = parsedContent[key];
                    }
                });

                showStatus("Content loaded successfully from GitHub!");
            } catch (err) {
                console.error(err);
                showStatus("Failed to load content: " + err.message, true);
            }
        }

        async function publishContent() {
            const owner = document.getElementById('gh-owner').value.trim();
            const repo = document.getElementById('gh-repo').value.trim();
            const token = document.getElementById('gh-token').value.trim();

            if (!owner || !repo || !token) {
                showStatus("Please enter your GitHub Username, Repo, and Token.", true);
                return;
            }

            const newContent = {};
            document.querySelectorAll('.content-field').forEach(el => {
                newContent[el.getAttribute('data-key')] = el.value;
            });

            const jsonString = JSON.stringify(newContent, null, 2);
            const base64Content = utf8_to_b64(jsonString);

            try {
                const url = `https://api.github.com/repos/${owner}/${repo}/contents/${filePath}`;
                
                const body = {
                    message: "Update site content via Cube Dashboard",
                    content: base64Content
                };

                // The GitHub API requires the exact SHA to overwrite an existing file
                if (currentFileSha) {
                    body.sha = currentFileSha;
                }

                const res = await fetch(url, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `token ${token}`,
                        'Accept': 'application/vnd.github+json',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(body)
                });

                if (!res.ok) throw new Error(await res.text());

                const data = await res.json();
                currentFileSha = data.content.sha; // Update SHA after a successful push

                showStatus("Changes published! Give it 1-2 minutes for GitHub Pages to deploy the update.");
            } catch (err) {
                console.error(err);
                showStatus("Failed to publish: " + err.message, true);
            }
        }

        document.getElementById('load-btn').addEventListener('click', fetchContent);
        document.getElementById('publish-btn').addEventListener('click', publishContent);
    </script>
</body>
</html>
