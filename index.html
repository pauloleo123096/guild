<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PHGuilds</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white font-sans antialiased">
    <!-- Header -->
    <header class="p-6 flex justify-between items-center border-b border-slate-800">
        <h1 class="text-2xl font-bold tracking-tight text-blue-400">PHGuilds</h1>
        <a href="#contact" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded font-medium transition">Get in Touch</a>
    </header>

    <!-- Hero -->
    <main class="max-w-4xl mx-auto py-20 px-6 text-center">
        <h2 class="text-5xl font-extrabold mb-6" data-content-id="hero-title">Welcome to PHGuilds</h2>
        <p class="text-xl text-slate-400 mb-10" data-content-id="hero-subtitle">A premier gaming and development community.</p>
        
        <div class="bg-slate-800 p-8 rounded-xl text-left border border-slate-700 mb-16 shadow-lg">
            <h3 class="text-2xl font-semibold mb-4 text-blue-400">About Us</h3>
            <p class="text-slate-300 leading-relaxed" data-content-id="about-text">We are a collective of developers and gamers building next-level experiences.</p>
        </div>

        <!-- Contact Form (Web3Forms) -->
        <section id="contact" class="bg-slate-800 p-8 rounded-xl text-left border border-slate-700 shadow-lg">
            <h3 class="text-2xl font-semibold mb-2 text-blue-400">Contact Us</h3>
            <p class="text-slate-400 mb-6">Reach out to us at <span data-content-id="contact-email" class="font-medium text-white">hello@phguilds.org</span> or use the form below.</p>
            
            <form action="https://api.web3forms.com/submit" method="POST" class="space-y-4">
                <!-- Replace with your actual Web3Forms Key -->
                <input type="hidden" name="access_key" value="YOUR_ACCESS_KEY_HERE">
                
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-1">Name</label>
                    <input type="text" name="name" required class="w-full bg-slate-900 border border-slate-700 rounded px-4 py-2 focus:outline-none focus:border-blue-500 text-white">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-1">Email</label>
                    <input type="email" name="email" required class="w-full bg-slate-900 border border-slate-700 rounded px-4 py-2 focus:outline-none focus:border-blue-500 text-white">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-1">Message</label>
                    <textarea name="message" required rows="4" class="w-full bg-slate-900 border border-slate-700 rounded px-4 py-2 focus:outline-none focus:border-blue-500 text-white"></textarea>
                </div>
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-3 rounded transition">Send Message</button>
            </form>
        </section>
    </main>

    <footer class="text-center p-6 text-slate-500 text-sm">
        &copy; 2026 PHGuilds. All rights reserved.
    </footer>

    <script>
        // Fetch content.json dynamically to populate the site
        document.addEventListener('DOMContentLoaded', async () => {
            try {
                // The ?v= timestamp prevents the browser from loading an outdated cached version
                const res = await fetch(`content.json?v=${new Date().getTime()}`);
                if (res.ok) {
                    const content = await res.json();
                    document.querySelectorAll('[data-content-id]').forEach(el => {
                        const key = el.getAttribute('data-content-id');
                        if (content[key]) {
                            el.innerHTML = content[key];
                        }
                    });
                }
            } catch (err) {
                console.log("content.json not found or error loading it. Defaulting to standard HTML text.");
            }
        });
    </script>
</body>
</html>
